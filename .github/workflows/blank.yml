name: Craveo CI Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    continue-on-error: true  # <-- Important! This makes it non-blocking

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Frontend & Backend
        run: npm run build || echo "Build failed — check locally"

      - name: Run Linter
        run: npm run lint || echo "Linting issues detected — check locally"

      - name: Run TypeScript Checks
        run: npx tsc --noEmit || echo "TypeScript errors found — check locally"
